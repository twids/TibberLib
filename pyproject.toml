[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tibberlib"
version = "0.2.0"
description = "Async client for evidence-backed Tibber app API operations"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "websockets>=15,<16"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
